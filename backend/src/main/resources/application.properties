
spring.application.name=campusmind-backend

server.port=8080

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# PostgreSQL configuration will be added when we configure the database
# Apache Solr configuration will be added during search-engine integration

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Application information
info.app.name=CampusMind
info.app.description=Academic Document Retrieval System
info.app.version=1.0.0
